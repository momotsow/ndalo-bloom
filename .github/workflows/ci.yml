name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history so the scan covers all commits in the push/PR range.
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gitleaks-action exits non-zero (failing the job) when secrets are found.

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        # Prisma client is generated via the postinstall script.

      - name: Dependency security audit
        # audit-ci fails the workflow on any HIGH/CRITICAL advisory in production
        # dependencies that is not explicitly triaged in audit-ci.jsonc.
        run: npm run audit:ci

      - name: Format check
        run: npm run format

      - name: Lint (includes architecture boundary rules)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests (unit, component/axe, architecture boundaries)
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  db-verification:
    name: Database Verification (Neon dev branch)
    runs-on: ubuntu-latest
    # Runs the Spec 2 database-dependent remediation that cannot run behind the
    # corporate network (outbound TCP 5432 is blocked locally). GitHub-hosted runners
    # can reach Neon. DATABASE_URL is injected as a SECRET pointing at the DEVELOPMENT
    # branch only — never committed, never the production branch.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — DATABASE_URL secret must be configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is not set. Configure it (Neon DEVELOPMENT branch) in repo settings." >&2
            exit 1
          fi
          echo "DATABASE_URL is present (value not printed)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        # Prisma client is generated via the postinstall script.

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply Prisma migration (deploy) to the development database
        run: npm run db:migrate:deploy

      - name: Run temporary development seed
        run: npm run db:seed

      - name: Verify PostgreSQL schema (no availability/inventory table)
        run: npm run db:verify

      - name: PostgreSQL integration tests (search, weighting, pg_trgm, availability)
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (real app → Postgres)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
